name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npx oxlint
      - run: npm test
      # The production build: the chunk groups and the service worker stamp in
      # vite.config.ts only run here, and tsc alone does not reach them.
      - run: npm run build
      # `npm run validate` needs a live ComfyUI and stays a local check.
