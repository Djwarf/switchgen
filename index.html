<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the layout can reach under notches and home bars;
         the CSS pads itself back with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#2e0000" />
    <meta name="description" content="Local AI image and video generation" />

    <title>SwitchGen</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SwitchGen" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="preload" href="/fonts/CrimsonText-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/CrimsonText-Bold.ttf" as="font" type="font/ttf" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Registered here rather than in main.tsx so the app's own entry point
      // stays owned by the UI code and this survives a rewrite of it.
      if ('serviceWorker' in navigator) {
        addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {
            /* Unsupported or blocked (private window, insecure origin) - the app
               works fine without it, so this is not worth surfacing. */
          })
        })
      }
    </script>
  </body>
</html>
